<style>
  /* Style SLC code chunks with grey background - more specific selectors */
  div.sourceCode[data-engine="slc"],
  pre.sourceCode[data-engine="slc"],
  .cell[data-engine="slc"] pre.sourceCode,
  .cell[data-engine="slc"] .sourceCode {
    background-color: #f5f5f5 !important;
  }

  /* Alternative selectors for SLC code chunks */
  pre.slc,
  code.slc,
  .slc pre,
  .slc code {
    background-color: #f5f5f5 !important;
  }

  /* Collapsible SLC output styling (log) */
  .slc-output-collapsible {
    border: 1px solid #ddd;
    border-radius: 6px;
    margin: 10px 0;
    background-color: #fafafa;
  }

  .slc-output-collapsible summary {
    background-color: #f0f0f0;
    padding: 10px 15px;
    cursor: pointer;
    font-weight: bold;
    font-size: 0.9em;
    border-bottom: 1px solid #ddd;
    user-select: none;
  }

  .slc-output-collapsible summary:hover {
    background-color: #e8e8e8;
  }

  .slc-output-collapsible[open] summary {
    border-bottom: 1px solid #ddd;
  }

  .slc-output-collapsible pre {
    margin: 0;
    padding: 15px;
    background-color: #f8f9fa;
    border-radius: 0 0 6px 6px;
  }

  /* Collapsible SLC listing output styling */
  .slc-listing-collapsible {
    border: 1px solid #c5d8f5;
    border-radius: 6px;
    margin: 10px 0;
    background-color: #f5f9ff;
  }

  .slc-listing-collapsible summary {
    background-color: #e8f0fe;
    padding: 10px 15px;
    cursor: pointer;
    font-weight: bold;
    font-size: 0.9em;
    border-bottom: 1px solid #c5d8f5;
    user-select: none;
  }

  .slc-listing-collapsible summary:hover {
    background-color: #d2e3fc;
  }

  .slc-listing-collapsible[open] summary {
    border-bottom: 1px solid #c5d8f5;
  }

  .slc-listing-collapsible pre {
    margin: 0;
    padding: 15px;
    background-color: #f8fbff;
    border-radius: 0 0 6px 6px;
  }

  /* Collapsible SLC table output styling */
  .slc-table-collapsible {
    border: 1px solid #b8d4b8;
    border-radius: 6px;
    margin: 10px 0;
    background-color: #f5fff5;
  }

  .slc-table-collapsible summary {
    background-color: #e0f0e0;
    padding: 10px 15px;
    cursor: pointer;
    font-weight: bold;
    font-size: 0.9em;
    border-bottom: 1px solid #b8d4b8;
    user-select: none;
  }

  .slc-table-collapsible summary:hover {
    background-color: #c8e6c8;
  }

  .slc-table-collapsible[open] summary {
    border-bottom: 1px solid #b8d4b8;
  }

  .slc-table-output {
    padding: 10px 15px;
    overflow-x: auto;
  }

  /* ODS TAGSETS.HTMLCSS table styling */
  .slc-ods-output {
    font-family: Arial, Helvetica, sans-serif;
    font-size: 0.9em;
    overflow-x: auto;
  }

  .slc-ods-output table {
    border-collapse: collapse;
    margin: 4px auto;
  }

  .slc-ods-output th,
  .slc-ods-output td {
    border: 1px solid #b0b0b0;
    padding: 3pt 6pt;
    text-align: left;
  }

  .slc-ods-output th {
    background-color: #003366;
    color: #ffffff;
    font-weight: bold;
  }

  .slc-ods-output tr:nth-child(even) td {
    background-color: #e8f0f8;
  }

  .slc-ods-output .SysTitleAndFooterContainer {
    display: none;
  }

  /* SAS syntax highlighting for SLC chunks */
  .cell[data-engine="slc"] .sourceCode .kw,
  .cell[data-engine="slc"] .sourceCode .cf {
    color: #0000ff !important;
    font-weight: bold;
  }

  .cell[data-engine="slc"] .sourceCode .st {
    color: #008000 !important;
  }

  .cell[data-engine="slc"] .sourceCode .co {
    color: #808080 !important;
    font-style: italic;
  }

  .cell[data-engine="slc"] .sourceCode .fu {
    color: #000080 !important;
  }

  .cell[data-engine="slc"] .sourceCode .dt {
    color: #800080 !important;
  }
</style>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    function makeCollapsible() {
      const allCells = document.querySelectorAll('.cell');
      let foundSlcCells = false;

      allCells.forEach(function (cell) {
        // Detect SLC cells via the engine attribute Quarto sets — reliable
        // across all chunk types without keyword-scanning the code text.
        const isSlcCell = cell.matches('[data-engine="slc"]') ||
          cell.querySelector('[data-engine="slc"]') !== null ||
          cell.querySelector('code.slc') !== null ||
          cell.querySelector('pre.slc') !== null;

        if (isSlcCell) {
          foundSlcCells = true;

          // Apply grey background to code blocks in this cell
          const codeBlocks = cell.querySelectorAll('pre.sourceCode');
          codeBlocks.forEach(function (block) {
            block.style.backgroundColor = '#f5f5f5';
          });

          // Also try to find the div.sourceCode
          const sourceDiv = cell.querySelector('div.sourceCode');
          if (sourceDiv) {
            sourceDiv.style.backgroundColor = '#f5f5f5';
          }
          const output = cell.querySelector('.cell-output');
          if (output && !output.querySelector('details')) {
            const outputContent = output.innerHTML;
            const listingStart = '&lt;!-- slc-listing-start --&gt;';
            const listingEnd = '&lt;!-- slc-listing-end --&gt;';
            const startIdx = outputContent.indexOf(listingStart);
            const endIdx = outputContent.indexOf(listingEnd);

            output.innerHTML = '';

            if (startIdx !== -1 && endIdx !== -1) {
              // Log block (everything before the sentinel)
              const logContent = outputContent.substring(0, startIdx);
              const logDetails = document.createElement('details');
              const logSummary = document.createElement('summary');
              logDetails.className = 'slc-output-collapsible';
              logSummary.textContent = '📊 SLC Output';
              logDetails.open = false;
              logDetails.appendChild(logSummary);
              logDetails.innerHTML += logContent;
              output.appendChild(logDetails);

              // Listing block (content between sentinels)
              const listingContent = outputContent.substring(
                startIdx + listingStart.length,
                endIdx
              );
              const lstDetails = document.createElement('details');
              const lstSummary = document.createElement('summary');
              lstDetails.className = 'slc-listing-collapsible';
              lstSummary.textContent = '📋 SLC Listing';
              lstDetails.open = false;
              lstDetails.appendChild(lstSummary);
              lstDetails.innerHTML += listingContent;
              output.appendChild(lstDetails);
            } else {
              // No listing — single log block
              const details = document.createElement('details');
              const summary = document.createElement('summary');
              details.className = 'slc-output-collapsible';
              summary.textContent = '📊 SLC Output';
              details.open = false;
              details.appendChild(summary);
              details.innerHTML += outputContent;
              output.appendChild(details);
            }
          }
        }
      });

      return foundSlcCells;
    }

    // Try immediately
    let success = makeCollapsible();

    // If not successful, try again after delays
    if (!success) {
      setTimeout(function () {
        success = makeCollapsible();
        if (!success) {
          setTimeout(makeCollapsible, 2000);
        }
      }, 1000);
    }
  });
</script>
